services:
  storypark-downloader:
    image: ghcr.io/alangrainger/storypark-downloader:latest
    container_name: storypark-downloader
    env_file: .env
    volumes:
      # Photos and videos only: point a photo library at this one.
      - ./downloads:/downloads
      # The state file and the calendar feed.
      - ./state:/state
    ports:
      - "${HEALTH_PORT:-3000}:3000"
    restart: unless-stopped
